<!DOCTYPE html>
<html lang="en">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Bundled jQuery copies: jQuery.parseHTML doesn't run inline event handlers (sonatype-2014-0026)</title>
	<script src="../../../speed/jquery-basis.js"></script>
	<script>
		window.basisjQuery = jQuery.noConflict( true );
	</script>
	<script src="../jquery-1.8.2.ajax_xhr.min.js"></script>
	<script>
		window.ajaxXhrjQuery = jQuery.noConflict( true );
	</script>
</head>
<body>
	<script>
		// "xss(#)" is swapped for a per-copy recorder and a per-payload index.
		var template = "<img src=url404 onerror=xss(#)>",
			basis, ajaxXhr;

		function check( $, name ) {
			var i, nodes,
				// Context-less calls must not run the inline event handler
				calls = [
					[ "jQuery.parseHTML( html )", function( html ) {
						$.parseHTML( html );
					} ],
					[ "jQuery.parseHTML( html, true )", function( html ) {
						$.parseHTML( html, true );
					} ],
					[ "jQuery.parseHTML( html, null, true )", function( html ) {
						$.parseHTML( html, null, true );
					} ]
				],
				result = {
					version: $.fn.jquery,
					hasParseHTML: !!$.parseHTML,
					supportCreateHTMLDocument: $.support.createHTMLDocument,
					controlFired: false,
					executed: []
				};

			function payload( index ) {
				return template.replace( "xss(#)", "xss_" + name + "(" + index + ")" );
			}

			window[ "xss_" + name ] = function( index ) {
				if ( index === calls.length ) {
					result.controlFired = true;
				} else {
					result.executed.push( calls[ index ][ 0 ] );
				}
			};

			if ( !$.parseHTML ) {
				return result;
			}

			for ( i = 0; i < calls.length; i++ ) {
				calls[ i ][ 1 ]( payload( i ) );
			}

			// Control: an explicit live-document context still parses in that
			// document (as jQuery( html ) does), so the handler does fire there.
			// This proves the payload is live in this browser.
			$.parseHTML( payload( calls.length ), document );

			// Parsed URLs still resolve against the page URL (gh-2965)
			result.anchorHref = $.parseHTML( "<a href='test.html'></a>" )[ 0 ].href;

			// Parsed nodes still work once inserted into the page
			nodes = $.parseHTML( "<div class='parsed-" + name + "'><b>bold</b></div>" );
			$( "<div></div>" ).append( nodes ).appendTo( document.body );
			result.insertedText = $( "div.parsed-" + name + " b" ).text();
			result.singleTag = $.parseHTML( "<span></span>" )[ 0 ].nodeName.toLowerCase();
			result.explicitContextOwner = $.parseHTML( "<i>x</i>", document )[ 0 ].ownerDocument === document;

			return result;
		}

		basis = check( window.basisjQuery, "basis" );
		ajaxXhr = check( window.ajaxXhrjQuery, "ajaxXhr" );

		// Give the url404 images time to fail and fire any injected onerror handler
		setTimeout(function() {
			window.parent.iframeCallback( basis, ajaxXhr );
		}, 1500 );
	</script>
</body>
</html>

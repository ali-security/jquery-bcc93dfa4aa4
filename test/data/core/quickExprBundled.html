<!DOCTYPE html>
<html lang="en">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Bundled jQuery copies: jQuery( string ) only treats strings that start with a tag as HTML (CVE-2012-6708)</title>
	<script src="../../../speed/jquery-basis.js"></script>
	<script>
		window.basisjQuery = jQuery.noConflict( true );
	</script>
	<script src="../jquery-1.8.2.ajax_xhr.min.js"></script>
	<script>
		window.ajaxXhrjQuery = jQuery.noConflict( true );
	</script>
	<script src="../../../dist/jquery.min.js"></script>
	<script>
		window.mainjQuery = jQuery.noConflict( true );
	</script>
</head>
<body>
	<div id="quick-target"></div>
	<script>
		// "xss(#)" is swapped for a per-copy recorder and a per-payload index.
		var template = "<img src=url404 onerror=xss(#)>",
			basis, ajaxXhr, main;

		function describe( elems ) {
			return elems.length + ":" + ( elems[ 0 ] && ( elems[ 0 ].id || elems[ 0 ].nodeName.toLowerCase() ) );
		}

		function insertedImages() {
			return document.getElementById( "quick-target" ).getElementsByTagName( "img" ).length;
		}

		function check( $, name ) {
			var i, elems, k,
				before = insertedImages(),
				// Strings with a tag that is not at the very start must not be
				// parsed as HTML (and so must not run its inline event handler)
				attacks = [
					[ "text before the tag", function( html ) {
						return $( "a" + html );
					} ],
					[ "text around the tag", function( html ) {
						return $( "text " + html + " text" );
					} ],
					[ "leading hash (location.hash)", function( html ) {
						return $( "#" + html );
					} ],
					[ "id selector before the tag", function( html ) {
						return $( "#quick-target " + html );
					} ],
					[ "leading whitespace before the tag", function( html ) {
						return $( " \n" + html );
					} ],
					[ "text before the tag, document context", function( html ) {
						return $( "a" + html, document );
					} ],
					[ "text before the tag, appended to the document", function( html ) {
						return $( "div " + html ).appendTo( "#quick-target" );
					} ]
				],
				result = {
					version: $.fn.jquery,
					parsedAsHtml: [],
					executed: [],
					outcomes: {},
					controlFired: false
				};

			function payload( index ) {
				return template.replace( "xss(#)", "xss_" + name + "(" + index + ")" );
			}

			window[ "xss_" + name ] = function( index ) {
				if ( index === attacks.length ) {
					result.controlFired = true;
				} else {
					result.executed.push( attacks[ index ][ 0 ] );
				}
			};

			for ( i = 0; i < attacks.length; i++ ) {
				try {
					elems = attacks[ i ][ 1 ]( payload( i ) );
					result.outcomes[ attacks[ i ][ 0 ] ] = elems.length + " element(s)";
					for ( k = 0; k < elems.length; k++ ) {
						if ( elems[ k ].nodeName && elems[ k ].nodeName.toLowerCase() === "img" ) {
							result.parsedAsHtml.push( attacks[ i ][ 0 ] );
							break;
						}
					}
				} catch ( e ) {
					// Not HTML, so the string went to the selector engine, which
					// rejects it as an invalid selector
					result.outcomes[ attacks[ i ][ 0 ] ] = "threw: " + ( e && e.message || e );
				}
			}
			result.inserted = insertedImages() - before;

			// Control: the same markup, starting with "<", is still HTML and is
			// parsed in the live document, so its handler does fire. This proves
			// the payload is live in this browser.
			result.control = describe( $( payload( attacks.length ) ) );

			// HTML strings that start with a tag keep working
			result.singleTag = describe( $( "<div/>" ) );
			result.trailingText = describe( $( "<p>text</p>trailing" ) );

			// #id strings are still id selectors
			result.idSelector = describe( $( "#quick-target" ) );

			return result;
		}

		basis = check( window.basisjQuery, "basis" );
		ajaxXhr = check( window.ajaxXhrjQuery, "ajaxXhr" );
		main = check( window.mainjQuery, "main" );

		// Give the url404 images time to fail and fire any injected onerror handler
		setTimeout(function() {
			window.parent.iframeCallback( basis, ajaxXhr, main );
		}, 1500 );
	</script>
</body>
</html>

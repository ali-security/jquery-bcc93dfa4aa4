<!DOCTYPE html>
<html lang="en">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Bundled jQuery copies: XHTML-style self-closing non-void tags are not expanded (gh-4642, CVE-2020-11022)</title>
	<script src="../../../speed/jquery-basis.js"></script>
	<script>
		window.basisjQuery = jQuery.noConflict( true );
	</script>
	<script src="../jquery-1.8.2.ajax_xhr.min.js"></script>
	<script>
		window.ajaxXhrjQuery = jQuery.noConflict( true );
	</script>
</head>
<body>
	<script>
		// Thanks to Masato Kinugawa from Cure53 for providing the following test cases.
		// Note: the xss() argument of each payload must equal its index in this array;
		// xss( is swapped for a per-copy recorder so each copy is judged on its own.
		var htmlStrings = [
				"<img alt=\"<x\" title=\"/><img src=url404 onerror=xss(0)>\">",
				"<img alt=\"\n<x\" title=\"/>\n<img src=url404 onerror=xss(1)>\">",
				"<style><style/><img src=url404 onerror=xss(2)>",
				"<xmp><xmp/><img src=url404 onerror=xss(3)>",
				"<title><title /><img src=url404 onerror=xss(4)>",
				"<iframe><iframe/><img src=url404 onerror=xss(5)>",
				"<noframes><noframes/><img src=url404 onerror=xss(6)>",
				"<noscript><noscript/><img src=url404 onerror=xss(7)>",
				"<foo\" alt=\"\" title=\"/><img src=url404 onerror=xss(8)>\">",
				"<img alt=\"<x\" title=\"\" src=\"/><img src=url404 onerror=xss(9)>\">",
				"<noscript/><img src=url404 onerror=xss(10)>",
				"<option><style></option></select><img src=url404 onerror=xss(11)></style>",
				"<template><style></template><img src=url404 onerror=xss(12)>"
			],
			basis, ajaxXhr;

		function check( $, name ) {
			var div, container, i,
				result = {
					version: $.fn.jquery,
					executed: []
				};

			window[ "xss_" + name ] = function( index ) {
				result.executed.push( index );
			};

			div = $( "<div></div>" ).html( "<div/><div/>" );
			result.htmlChildren = div.children().length;
			result.htmlGrandchildren = div.children().children().length;

			div = $( "<div></div>" ).append( "<div/><div/>" );
			result.appendChildren = div.children().length;
			result.appendGrandchildren = div.children().children().length;

			result.topLevel = $( "<div/><div/>" ).length;

			result.explicitChildren = $( "<div></div>" ).html( "<div></div><div></div>" ).children().length;

			container = $( "<div></div>" ).appendTo( document.body );
			for ( i = 0; i < htmlStrings.length; i++ ) {
				$( "<div></div>" ).appendTo( container ).html( htmlStrings[ i ].replace( "xss(", "xss_" + name + "(" ) );
			}

			return result;
		}

		basis = check( window.basisjQuery, "basis" );
		ajaxXhr = check( window.ajaxXhrjQuery, "ajaxXhr" );

		// Give the url404 images time to fail and fire any injected onerror handler
		setTimeout(function() {
			window.parent.iframeCallback( basis, ajaxXhr );
		}, 1000 );
	</script>
</body>
</html>
